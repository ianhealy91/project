version: 2
updates:
  - package-ecosystem: nuget
    directory: "/Logbook"
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "nuget"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
    labels:
      - "dependencies"
      - "github-actions"